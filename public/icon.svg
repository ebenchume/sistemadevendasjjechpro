<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with padding for maskable safe-zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-dasharray="24 16" opacity="0.8" />
  
  <!-- Server / Hub Core Nodes -->
  <circle cx="256" cy="108" r="24" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="384" cy="330" r="20" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="128" cy="330" r="20" fill="url(#primaryGrad)" filter="url(#glow)" />

  <!-- Inner Sync Hex Core -->
  <polygon points="256,170 330,212 330,298 256,340 182,298 182,212" fill="#1e1e38" stroke="url(#primaryGrad)" stroke-width="8" />

  <!-- Central Biometric & Sync Shield -->
  <path d="M256 200 L296 220 V260 C296 288 278 308 256 316 C234 308 216 288 216 260 V220 Z" fill="url(#accentGrad)" opacity="0.9" />
  <circle cx="256" cy="256" r="10" fill="#0f172a" />
</svg>
